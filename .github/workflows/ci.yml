name: Build Pages

# The deploy workflow already builds on every push to main, so this one only
# needs to check pull requests, where nothing is deployed.
on:
  pull_request:

# Nothing here writes anything; the repository default is already read-only,
# and stating it means a change to that default cannot widen this workflow.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          cache-version: 0

      - name: Build with Jekyll
        run: bundle exec jekyll build
